<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이력서 PDF 미리보기와 다운로드">
  <title>이력서</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #202124;
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 14px; line-height: 1.6; }
    main { max-width: 720px; padding: 0 24px; margin: 72px auto 64px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -.035em; }
    h2 { font-size: 16px; font-weight: 650; line-height: 1.4; }
    header { margin-bottom: 36px; }
    .intro { margin-top: 9px; color: #555; }
    .meta { margin-top: 12px; font-size: 12px; color: #777; }
    section { border-top: 1px solid #dedede; padding: 24px 0 30px; }
    .section-note { margin-top: 7px; font-size: 13px; color: #777; }
    a { color: inherit; text-underline-offset: 3px; }
    a:hover { color: #000; }
    a:focus-visible { outline: 2px solid #333; outline-offset: 4px; }
    .document-list { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid #ededed; }
    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 17px 0;
      border-bottom: 1px solid #ededed;
    }
    .document-info { min-width: 0; }
    .document-title { font-size: 14px; font-weight: 650; }
    .document-description { margin-top: 3px; font-size: 13px; color: #666; }
    .document-meta { margin-top: 4px; font-size: 12px; color: #888; }
    .document-download { flex: none; font-size: 13px; white-space: nowrap; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 12px; top: 12px; z-index: 1; padding: 6px; background: #fff; }
    .viewer { margin-top: 20px; border: 1px solid #dedede; border-radius: 3px; overflow: hidden; background: #f5f5f5; }
    .viewer object { display: block; width: 100%; height: 1000px; }
    .viewer-fallback { padding: 24px; font-size: 13px; color: #666; }
    @media (max-width: 520px) {
      main { margin-top: 44px; padding: 0 20px; }
      header { margin-bottom: 30px; }
      h1 { font-size: 26px; }
      .document-item { align-items: flex-start; gap: 12px; }
      .document-download { padding-top: 2px; }
      .viewer object { height: 560px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#documents">문서로 이동</a>
  <main>
    <header>
      <h1>이력서</h1>
      <p class="intro">이력서 미리보기 및 다운로드</p>
      <p class="meta">최종 업데이트: 2026.11.19 · PDF 1개</p>
    </header>

    <section id="documents" aria-labelledby="documents-title">
      <h2 id="documents-title">이력서</h2>
      <p class="section-note">파일명을 클릭하면 PDF가 새 탭에서 열립니다.</p>
      <ul class="document-list" aria-label="다운로드 가능한 문서">
        <li class="document-item">
          <div class="document-info">
            <a class="document-title" href="./resume.pdf" target="_blank" rel="noopener noreferrer" aria-label="이력서 PDF 미리보기 (새 탭)">이력서</a>
            <p class="document-description">백엔드 개발자 이력서</p>
            <p class="document-meta">PDF · 86 KB</p>
          </div>
          <a class="document-download" href="./resume.pdf" download="resume.pdf" aria-label="이력서 PDF 다운로드">다운로드</a>
        </li>
      </ul>
      <div class="viewer">
        <object data="./resume.pdf#view=FitH" type="application/pdf" aria-label="이력서 PDF 미리보기">
          <p class="viewer-fallback">이 브라우저에서는 PDF 미리보기를 지원하지 않습니다. <a href="./resume.pdf" target="_blank" rel="noopener noreferrer">새 탭에서 열기</a></p>
        </object>
      </div>
    </section>
  </main>
</body>
</html>
