<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="이력서와 포트폴리오 PDF 다운로드">
  <title>지원 서류</title>
  <link rel="stylesheet" href="./assets/site.css">
  <script src="./assets/site.js" defer></script>
</head>
<body>
  <a class="skip" href="#documents">문서 목록으로 이동</a>
  <main>
    <header>
      <h1>지원 서류</h1>
      <p>이력서와 포트폴리오를 다운로드할 수 있습니다.</p>
      <p class="metadata">
        <span id="updated-at">배포 정보 확인 중</span>
        · <span id="document-total">문서 목록 불러오는 중</span>
      </p>
    </header>

    <section aria-labelledby="all-title">
      <h2 id="all-title">전체 다운로드</h2>
      <p>
        <a id="download-all" class="disabled" href="./application.zip"
           download="application.zip" aria-disabled="true" tabindex="-1">전체 ZIP 다운로드</a>
      </p>
    </section>

    <section id="documents" aria-labelledby="documents-title">
      <h2 id="documents-title">개별 및 선택 다운로드</h2>
      <p>문서를 선택한 후 ZIP으로 받거나, 각 PDF를 개별 다운로드할 수 있습니다.</p>
      <p class="selection-actions">
        <button type="button" id="select-all" disabled>전체 선택</button>
        <button type="button" id="clear-selection" disabled>선택 해제</button>
      </p>

      <p id="status" role="status" aria-live="polite">문서 목록을 불러오고 있습니다.</p>
      <div id="document-list" aria-label="다운로드 가능한 문서"></div>

      <p class="selection-footer">
        <span id="selected-count">0개 선택</span>
        <button id="download-selected" type="button" disabled>선택 문서 ZIP 다운로드</button>
      </p>
    </section>
  </main>
  <footer><small>© <span id="year"></span></small></footer>
  <noscript>
    <p>문서 선택 기능은 JavaScript가 필요합니다.
      <a href="./application.zip" download>전체 ZIP 다운로드</a>를 이용해 주세요.</p>
  </noscript>
</body>
</html>
